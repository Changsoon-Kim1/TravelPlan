<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>제주 올레길 여행 계획</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/style.css?v=202611271200">
</head>
<body>
  <header id="topbar">
    <button type="button" class="brand" id="tripSwitch" aria-label="여행 바꾸기">
      <span class="logo">🍊</span>
      <span class="brand-text"><b id="tripTitle">여행 계획</b><small id="tripDates"></small></span>
      <span class="caret" id="tripCaret" hidden>▾</span>
    </button>
    <nav id="tabs" aria-label="화면 전환">
      <button type="button" data-view="map" class="on">🗺️ <span>지도</span></button>
      <button type="button" data-view="cal">📅 <span>캘린더</span></button>
    </nav>
    <div class="top-actions">
      <span id="modeBadge" class="badge"></span>
      <button type="button" id="menuBtn" aria-label="메뉴" aria-haspopup="true">⋯</button>
    </div>
    <div id="menu" hidden>
      <div id="menuUser" class="menu-user" hidden></div>
      <button type="button" data-act="trips" data-owner>🧳 내 여행 (목록·새 여행)</button>
      <button type="button" data-act="share" data-owner data-needtrip>🔗 공유 링크 (배우자에게 보내기)</button>
      <button type="button" data-act="gpx" data-owner data-olle data-needtrip>🗺 코스 GPX 올리기</button>
      <button type="button" data-act="refresh">🔄 새로고침</button>
      <button type="button" data-act="login" data-guest>🔑 내 계정으로 로그인</button>
      <button type="button" data-act="album">📸 사진 앨범 리포트 (내 기기에서만)</button>
      <button type="button" data-act="logout" data-owner>로그아웃</button>
    </div>
  </header>

  <main>
    <section id="viewMap" class="view on">
      <div id="map" aria-label="지도"></div>
      <div id="appVer">v0.1.1</div>
      <div id="mapOverlay">
        <form id="placeForm" class="place-form" role="search" autocomplete="off">
          <input id="placeQ" type="search" enterkeyhint="search" placeholder="🔍 장소 검색 (예: 제주 신라호텔)" aria-label="장소 검색">
          <button type="submit" id="placeGo">검색</button>
        </form>
        <ul id="placeResults" class="place-results" hidden></ul>
        <div id="filterBar" class="filter-bar" role="group" aria-label="코스 필터"></div>
        <div id="mapNotice" class="map-notice" hidden></div>
      </div>
      <aside id="panel" hidden aria-label="코스 상세"></aside>
    </section>
    <section id="viewCal" class="view">
      <div id="calRoot" class="cal-root"></div>
    </section>
  </main>

  <div id="gate" hidden>
    <div class="gate-card">
      <div class="logo-big">🍊</div>
      <h1>제주 올레길 여행 계획</h1>
      <p id="gateMsg" class="muted" hidden></p>
      <form id="gateForm">
        <label>이메일<input type="email" id="gateEmail" autocomplete="username" required></label>
        <label>비밀번호<input type="password" id="gatePw" autocomplete="current-password" required></label>
        <button type="submit" class="btn primary block" id="gateGo">로그인</button>
      </form>
      <button type="button" class="btn block" id="gateRetry" hidden>다시 시도</button>
      <p class="muted sm">배우자는 받은 공유 링크로 접속하면 로그인이 필요 없어요.</p>
    </div>
  </div>

  <div id="loading">불러오는 중…</div>
  <div id="reportRoot" class="report-root" hidden></div>
  <div id="modalRoot"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript><p style="padding:16px">이 앱은 JavaScript가 필요합니다.</p></noscript>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="data/courses.js?v=202611271200"></script>
  <script src="data/course_extra.js?v=202611271200"></script>
  <script src="data/anchors.js?v=202611271200"></script>
  <script src="js/config.js?v=202611271200"></script>
  <script src="js/core.js?v=202611271200"></script>
  <script src="js/util.js?v=202611271200"></script>
  <script src="js/courses.js?v=202611271200"></script>
  <script src="js/api.js?v=202611271200"></script>
  <script src="js/places.js?v=202611271200"></script>
  <script src="js/map.js?v=202611271200"></script>
  <script src="js/panel.js?v=202611271200"></script>
  <script src="js/report.js?v=202611271200"></script>
  <script src="js/calendar.js?v=202611271200"></script>
  <script src="js/trips.js?v=202611271200"></script>
  <script src="js/dialogs.js?v=202611271200"></script>
  <script src="js/app.js?v=202611271200"></script>
</body>
</html>
