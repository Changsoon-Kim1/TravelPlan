<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>여행 앨범 리포트</title>
<style id="albumCss">
:root { --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; --brand:#0f766e; --brand-dark:#115e59; }
* { box-sizing: border-box; }
body { margin: 0; font: 15px/1.5 -apple-system, "Segoe UI", "Noto Sans KR", sans-serif; color: var(--ink); background: #e2e8f0; }
.wrap { max-width: 820px; margin: 0 auto; padding: 12px; }
.card { background: #fff; border-radius: 14px; padding: 16px; margin-bottom: 12px; }
h1 { margin: 0 0 4px; font-size: 20px; } h2 { margin: 0 0 8px; font-size: 15px; color: var(--brand-dark); border-bottom: 2px solid var(--brand); padding-bottom: 4px; }
.muted { color: var(--muted); } .sm { font-size: 12.5px; }
.privacy { background: #f0fdfa; border-radius: 10px; padding: 8px 10px; font-size: 13px; margin: 8px 0 12px; }
label { display: block; font-weight: 600; font-size: 13.5px; margin: 10px 0 4px; }
input[type=text], input[type=number], select { width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 10px; font: inherit; background: #fff; }
input[type=file] { width: 100%; padding: 8px; border: 1px dashed #94a3b8; border-radius: 10px; background: #f8fafc; font: inherit; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn { display: inline-block; padding: 10px 14px; border: 1px solid var(--line); background: #fff; border-radius: 10px; font: inherit; font-weight: 600; cursor: pointer; text-decoration: none; color: var(--ink); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn:disabled { opacity: .5; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
#progress { margin-top: 8px; font-size: 13px; color: var(--muted); }
.err { color: #dc2626; font-size: 13px; margin-top: 8px; }
/* 리포트 */
.rp { background: #fff; border-radius: 14px; padding: 20px 18px 24px; }
.rp-sub { color: var(--muted); font-size: 13px; }
.rp-sec { margin-top: 18px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stats div { background: #f0fdfa; border-radius: 10px; padding: 8px; text-align: center; }
.stats small { display: block; color: var(--muted); font-size: 11px; } .stats b { font-size: 15px; }
svg.map, svg.elev { width: 100%; height: auto; display: block; background: #f8fafc; border: 1px solid var(--line); border-radius: 10px; }
.photos { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.ph { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; break-inside: avoid; background: #fff; }
.ph img { width: 100%; display: block; background: #e2e8f0; }
.ph .cap { padding: 6px 8px 8px; font-size: 12.5px; line-height: 1.4; }
.ph .no { display: inline-block; min-width: 20px; padding: 0 5px; border-radius: 10px; background: var(--brand); color: #fff; font-weight: 700; text-align: center; margin-right: 4px; }
.ph .src { color: var(--muted); }
.ph .warn { color: #b45309; }
.daytitle { margin: 14px 0 6px; font-weight: 700; }
.foot { margin-top: 16px; color: var(--muted); font-size: 11.5px; text-align: center; }
@media (min-width: 640px) { .photos { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 520px) { .stats { grid-template-columns: repeat(2, 1fr); } .two { grid-template-columns: 1fr; } }
@media print {
  @page { size: A4; margin: 12mm; }
  body { background: #fff; } .wrap { max-width: none; padding: 0; } .noprint { display: none !important; }
  .rp { border-radius: 0; padding: 0; } .photos { grid-template-columns: repeat(3, 1fr); }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="card noprint" id="setup">
    <h1>📸 여행 앨범 리포트</h1>
    <div class="muted sm">하루 GPX 기록과 사진을 시간으로 맞춰, 걸은 길 위에 사진을 올린 리포트를 만들어요.</div>
    <div class="privacy">🔒 사진과 GPX는 <b>이 기기의 브라우저 안에서만</b> 처리돼요. 서버로 보내거나 저장하지 않아요. (만든 리포트는 PDF나 HTML 파일로 내 기기에 저장할 수 있어요.)</div>
    <label for="gpxFile">① GPX 기록 <span class="muted">(하루치 1개, 없어도 돼요)</span></label>
    <input type="file" id="gpxFile" accept=".gpx,application/gpx+xml,text/xml,application/xml">
    <label for="photoFiles">② 사진 <span class="muted">(여러 장 선택)</span></label>
    <input type="file" id="photoFiles" accept="image/*" multiple>
    <div class="muted sm" style="margin-top:4px">💡 안드로이드는 "사진 선택" 화면 대신 <b>파일(내 파일)</b>에서 고르면 위치 정보가 남는 경우가 많아요. 위치 정보가 없어도 GPX와 시간으로 맞춰요.</div>
    <div class="two">
      <div><label for="tz">사진 시각 기준 시간대</label>
        <select id="tz"><option value="540" selected>한국 (UTC+9)</option><option value="0">UTC</option><option value="480">중국·싱가포르 (UTC+8)</option><option value="420">태국·베트남 (UTC+7)</option><option value="-480">미국 서부 (UTC-8)</option><option value="60">유럽 중부 (UTC+1)</option></select></div>
      <div><label for="shift">시계 보정 <span class="muted">(초, 사진이 GPX보다 빠르면 +)</span></label>
        <input type="number" id="shift" value="0" step="1"></div>
    </div>
    <label for="title">리포트 제목 <span class="muted">(비우면 자동)</span></label>
    <input type="text" id="title" maxlength="80" placeholder="예: 속리산 산행">
    <div class="bar"><button class="btn primary" id="make" type="button">리포트 만들기</button></div>
    <div id="progress" aria-live="polite"></div>
    <div class="err" id="err" hidden></div>
  </div>
  <div id="out"></div>
</div>
<script src="js/core.js"></script>
<script src="js/exif.js"></script>
<script src="js/album.js"></script>
</body>
</html>
